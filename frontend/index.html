    <script>
      const DEBUG_SERVER_URL = window.__DEBUG_SERVER_URL__ || "";
      function postDebugEvent(payload) {
        if (!DEBUG_SERVER_URL) return;
        fetch(DEBUG_SERVER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        }).catch(() => {});
      }

      // #region debug-point A:inline-startup
      window.addEventListener("error", function (event) {
        const target = event && event.target;
        postDebugEvent({
          sessionId: "empty-ui",
          runId: "pre-fix",
          hypothesisId: "A",
          location: "app.py:inline-startup",
          msg: "[DEBUG] Empty UI startup error",
          data: {
            message: event && event.message ? event.message : "",
            filename: event && event.filename ? event.filename : "",
            lineno: event && event.lineno ? event.lineno : 0,
            colno: event && event.colno ? event.colno : 0,
            tagName: target && target.tagName ? target.tagName : "",
            source: target && target.src ? target.src : "",
          },
          ts: Date.now(),
        });
      }, true);
      // #endregion
    </script>
    <script>
      // Download names: every file the app saves is "<project name>-<model used>.<ext>".
      // window.__ccProjectName is kept current by the app (empty outside a project).
      (function () {
        var BAD = '/:*?"<>|' + String.fromCharCode(92);
        var EXT_FIX = { mpeg: "mp3", "x-wav": "wav", wave: "wav", quicktime: "mov", jpeg: "jpg", "svg+xml": "svg", "x-m4a": "m4a", plain: "txt" };
        function clean(s) {
          return String(s || "").split("").filter(function (c) { return BAD.indexOf(c) < 0 && c.charCodeAt(0) >= 32; }).join("").replace(/ +/g, " ").trim();
        }
        function extOf(url, fallback) {
          var u = String(url || "");
          var ext = "";
          if (u.indexOf("data:") === 0) {
            var mime = u.slice(5, u.indexOf(";") > 0 ? u.indexOf(";") : u.indexOf(","));
            ext = (mime.split("/")[1] || "").toLowerCase();
          } else if (u.indexOf("blob:") !== 0) {
            var last = u.split("#")[0].split("?")[0].split("/").pop() || "";
            var dot = last.lastIndexOf(".");
            ext = dot > 0 ? last.slice(dot + 1).toLowerCase() : "";
          }
          ext = EXT_FIX[ext] || ext;
          if (!ext || ext.length > 5 || !/^[a-z0-9]+$/.test(ext)) ext = String(fallback || "").replace(".", "");
          return ext;
        }
        function downloadName(model, url, fallbackExt) {
          var project = clean(window.__ccProjectName) || "Content Creator";
          var ext = extOf(url, fallbackExt);
          return project + "-" + (clean(model) || "file") + (ext ? "." + ext : "");
        }
        function download(url, model, fallbackExt) {
          if (!url) return;
          var name = downloadName(model, url, fallbackExt);
          var a = document.createElement("a");
          var u = String(url);
          if (u.indexOf("data:") === 0 || u.indexOf("blob:") === 0) {
            a.href = u;
          } else {
            a.href = "/download?url=" + encodeURIComponent(u) + "&name=" + encodeURIComponent(name);
          }
          a.download = name;
          a.setAttribute("data-cc-raw", "1");
          document.body.appendChild(a);
          a.click();
          a.remove();
        }
        window.ccDownloadName = downloadName;
        window.ccDownload = download;
        // Any <a download> in the app is saved the same way; data-model names the model used.
        document.addEventListener("click", function (e) {
          var a = e.target && e.target.closest ? e.target.closest("a[download]") : null;
          if (!a || a.hasAttribute("data-cc-raw")) return;
          var href = a.getAttribute("href") || "";
          if (!href || href.indexOf("/download?") === 0) return;
          e.preventDefault();
          download(href, a.getAttribute("data-model") || "file", a.getAttribute("data-ext") || "");
        }, true);
      })();
    </script>
